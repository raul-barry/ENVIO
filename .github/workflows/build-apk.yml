name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ENVIO-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Deja el APK en la seccion "Releases" para descargarlo directo desde el telefono:
      # https://github.com/<usuario>/<repo>/releases/tag/latest
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ENVIO.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ENVIO.apk \
            --target "${{ github.sha }}" \
            --title "ENVIO (compilacion ${{ github.run_number }})" \
            --notes "APK de prueba de ENVIO. Compilacion ${{ github.run_number }}." \
            --latest
